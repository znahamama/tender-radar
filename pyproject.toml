[tool.ruff]
target-version = "py312"
extend-exclude = ["backend/*/migrations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend"]
filterwarnings = [
    # WhiteNoise: staticfiles/ only exists inside the image (collectstatic at build).
    "ignore:No directory at:UserWarning",
]
