#   1.0     TITLE
#
#   Waterline Upgrades, Prosser Rock, NL
#
#   2.0     DESCRIPTION
#
#   2.1     Scope of Work
#
#   The purpose of this project is to complete waterline upgrades at Prosser Rock in St. John’s, NL.
#
#   The Work includes, but is not limited to, the following:
#
#   •       Supply and installation of a heated domestic water enclosure.
#   •       Supply and installation of a heated domestic/fire water enclosure.
#   •       Supply and installation of a domestic water entrance at the Harbour Authority building.
#   •       Repairs to an existing waterline section near one of the post hydrants.
#   •       Supply and installation of concrete pads, complete with protection bollards, to support
#   the new heated enclosures.
#   •       Providing electrical work, including trenching and connection to existing waterlines.
#   Placement of new granulars and asphalt will be at the
#   Contractor’s cost.
#   •       All associated water works required for a complete installation, including thrust
#   blocks, valves, saddles, and piping.
#   •       Where the existing water pipe is to be connected to the main line on the west side of
#   the site, the contractor must conduct all work in accordance with
#   the City of St. John’s regulations for tapping into an existing main, including the supply and
#   installation of a curb stop, valve, and valve box adjacent to
#   the road where required.
#
#   The contractor must coordinate all construction activities to minimize disruption to operations
#   in the area and must maintain safe access around the work site at all times.
#
#   3.0     FAMILIARIZATION WITH THE SITE
#
#   Before submitting a bid, it is recommended that Contractors visit the site and its surroundings,
#   at their own expense and schedule, to review and verify the form, nature and extent of the work,
#   materials necessary for the completion of the works, the means of access to the site (including
#   ferry services), severity, exposure and uncertainty of weather, soil conditions, any
#   accommodations they may require, and in general shall obtain all necessary information as to
#   risks, contingencies and other circumstances which may influence or affect their bid.  No
#   allowance shall be made subsequently in this connection on account of error or negligence to
#   properly observe and determine the conditions that will apply.
#
#   Take all appropriate safety measures for any visit to the site, either before or after
#   acceptance of the bid.
#
#   4.0     DELIVERY
#
#   The completion date for all work under this project must be November 30, 2026.
