#   3 - Service Contracts (Excluding Architectural and Engineering Services).
#
#   d.  For requirements estimated above the departmental contracting limit of $400,000.00
#   (applicable taxes included):
#
#   The requirement is outside the scope of the supply arrangements and the requirement must be
#   administered separately by a PWGSC Contracting Authority.
#
#   i.  The proposed requirement is subject to the following Comprehensive Land Claims Agreement(s)
#   (CLCAs) (see 2.2.ii.).  One or more of the following CLCAs may apply to the bid solicitation of
