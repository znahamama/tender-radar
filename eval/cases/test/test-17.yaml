#   Hazardous Waste Disposal Services, PWGSC, National
#
#   This requirement is to establish multiple Supply Arrangements to provide all labour, materials,
#   equipment, tools and supervision necessary for the identification, labelling, packaging,
#   reparation of profile documentation sheets, loading, transportation and disposal/destruction of
#   user-generated hazardous waste products for various Federal Government Departments and Agencies
#   within Canada.  These Supply Arrangements are meant for the procurement of professional and
#   commercial services under those approval authorities.
#
#   Suppliers must be licensed and permitted to provide hazardous waste disposal services within one
#   or more provinces or territories.
#
#   The Supply Arrangements have no defined end-date and will remain valid until such time as PWGSC
#   no longer considers it to be advantageous to use them.  They will replace the Supply
#   Arrangements currently in place under EW479-150546 & EW479-162880/B Hazardous Waste Disposal.
#
#   Two streams of Supply Arrangements may be issued pursuant to this solicitation, as follows:
#
#   1)  Any supplier, including Indigenous suppliers, wishing to submit an arrangement not pursuant
#   to the Procurement Strategy for Aboriginal Business (PSAB). For the purpose of the RFSA, this
#   stream is titled ?General? or ?General Suppliers? or ?General stream.?  General Suppliers must
#   be able to provide the services either across Canada (nationally) or in at least one region of
#   Canada.
#
#   i)  Requirements in the general stream have three tiers with separate instructions, as defined
#   in Part 6 (B), Section 2 - Bid Solicitation of this RFSA:
#
#   a.  For requirements estimated below $40,000.00 (applicable taxes included):
#
#   For bid solicitations valued at $25,000.00 or more (including applicable taxes), if, and only
#   if, the requirement covered by the bid solicitation of any resulting supply arrangement is
#   administered by PWGSC, the requirement will be subject to a preference for Canadian goods and/or
#   services or will be limited to Canadian goods and/or services.
#
#   Otherwise, the requirement is subject to the Government Contracts Regulations (GCRs)
#   b.  For requirements estimated at $40,000.00 to $100,000.00 (applicable taxes included):
#
#   If, and only if, the requirement covered by the bid solicitation of any resulting supply
#   arrangement is administered by PWGSC, the requirement will be subject to a preference for
#   Canadian goods and/or services or will be limited to Canadian goods and/or services.
#
#   Otherwise, the requirement is subject to the Government Contracts Regulations (GCRs) in a
#   similar fashion to 2.1.i.a.
#   c.  For requirements estimated at $100,000.00 to the departmental contracting limit of
#   $400,000.00 (applicable taxes included)
#
#   The requirement may be subject to the provisions of the World Trade Organization Agreement on
#   Government Procurement (WTO-AGP) and the Agreement on Internal Trade (AIT).  The departmental
#   contracting limits are specified in the Treasury Board Secretariat’s Contracting Policy,
