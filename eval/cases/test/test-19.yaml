#   1.0     TITLE
#
#   Floating Dock Replacement - Charlottetown, Labrador
#
#   2.0 DESCRIPTION
#
#   2.1 Scope of Work
#
#   The purpose of this project is to replace existing floating dock infrastructure at the
#   Charlottetown harbour facility in Charlottetown, Labrador.
#
#   The Work includes, but is not limited to, the following:
#
#   1.      Provide all labour, materials, equipment, supervision, and incidentals required to
#   complete the Work.
#   2.      Remove and dispose of four (4) existing floating docks, including associated mooring
#   systems and two (2) concrete anchor blocks.
#   3.      Remove and dispose of two (2) existing timber gangways.
#   4.      Remove and dispose of timber decking and related components on existing headblock cribs,
#   including wheelguards, blocking, and connection hardware, and salvage select items for reuse.
#   5.      Supply, construct, and install four (4) new floating docks complete with mooring
#   systems, connection hardware, and anchor systems.
#   6.      Supply, construct, and install two (2) new timber gangways complete with all required
#   connections.
#   7.      Install new treated timber decking, wheelguards, and blocking on existing headblock
#   cribs, including the reinstallation of salvaged components.
#
#   The Contractor shall be responsible for delivering a complete and fully functional floating dock
#   system, including all associated components and works necessary for safe and operational use.
#
#   3.0     FAMILIARIZATION WITH THE SITE
#
#   Before submitting a bid, it is recommended that Contractors visit the site and its surroundings,
#   at their own expense and schedule, to review and verify the form, nature and extent of the work,
#   materials necessary for the completion of the works, the means of access to the site (including
#   ferry services), severity, exposure and uncertainty of weather, soil conditions, any
#   accommodations they may require, and in general shall obtain all necessary information as to
#   risks, contingencies and other circumstances which may influence or affect their bid.  No
#   allowance shall be made subsequently in this connection on account of error or negligence to
#   properly observe and determine the conditions that will apply.
#
#   Take all appropriate safety measures for any site visit, either before or after acceptance of
#   the bid.
#
#   4.0     DELIVERY
#
#   The completion date for all work under this project must be November 30, 2026.
# ==================================================================================================

