#
#   LOCATION
#
#   Port au Choix, Newfoundland 50.7031° N, 57.3522° W (50°42'11"N 57°21'08"W)
#
#   SCOPE OF WORK
#
#   The work consists of the furnishing of all plant, labour, equipment and material for wharf
#   repairs at Port Au Choix, Newfoundland, in strict accordance with specifications and
#   accompanying drawings and subject to all terms and conditions of the Contract.
#
#   Work will consist of, but will not necessarily be limited to, the following:
#
#   •       Repairs to Structure 404 consisting of the supply, fabrication, and installation of new
#   bent plate wale supports, steel walers and associated steel plates, wheelguards, wheelguard
#   blocking, coping, fender systems, ladders, and deck resurfacing.
#
#   •       Plate repair for a hole in the pile 10C on Structure 404, as noted on the drawings.
#
#   •       Repairs to Structure 407 involving new fenders, ladders, D-bore fenders and wheelguard.
#   Painting of existing wheelguard is also required.
#
#   FAMILARIAZATION OF SITE
#
#   There will be no mandatory or optional site visit. Bidders may access and view the site
#   independently.
#
#   DELIVERY
#
#   The Contractor must perform and complete the work under this project within sixteen (18) weeks
#   of contract award.
